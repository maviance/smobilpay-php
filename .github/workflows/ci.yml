name: CI

on:
  push:
    branches: [master, develop, 'feature/**']
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test (PHP ${{ matrix.php }}, deps=${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        deps: [highest, lowest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: pcov
          tools: composer:v2, cs2pr

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ matrix.deps }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-${{ matrix.deps }}-

      - name: Install dependencies (${{ matrix.deps }})
        run: |
          if [ "${{ matrix.deps }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --prefer-stable --no-interaction --no-progress
          fi

      - name: PHP-CS-Fixer (PSR-12)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
        if: matrix.php == '8.2' && matrix.deps == 'highest'

      - name: PHPStan (level 8)
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress
        if: matrix.php == '8.2' && matrix.deps == 'highest'

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=always

      - name: Coverage gate (>=80% lines on src/ excl. src/Model)
        if: matrix.php == '8.2' && matrix.deps == 'highest'
        run: |
          vendor/bin/phpunit --coverage-clover=coverage.xml
          php -r '
            $xml = simplexml_load_file("coverage.xml");
            if ($xml === false) { fwrite(STDERR, "no coverage report\n"); exit(1); }
            $metrics = $xml->project->metrics;
            $stmts = (int) $metrics["statements"];
            $covered = (int) $metrics["coveredstatements"];
            if ($stmts === 0) { fwrite(STDERR, "no statements measured\n"); exit(1); }
            $pct = $covered * 100.0 / $stmts;
            printf("Line coverage: %.2f%% (%d / %d)\n", $pct, $covered, $stmts);
            if ($pct < 80.0) { fwrite(STDERR, "Coverage gate FAILED (>=80%% required)\n"); exit(1); }
            echo "Coverage gate PASSED\n";
          '

      - name: Smoke test (offline mode)
        if: matrix.php == '8.2' && matrix.deps == 'highest'
        run: |
          cp smoke-test.example.json smoke-test.json
          bin/smoke-test --offline --strip-volatile
